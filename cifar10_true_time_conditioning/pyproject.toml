[project]
name = "iclr2027-research"
version = "0.1.0"
requires-python = ">=3.11.15"
dependencies = [
    "numpy==1.26.4",
    "pyyaml==6.0.2",
    "torch==2.5.1",
    "torchvision==0.20.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
